version: "3.8"

services:
  # Bot Configuration
  freqtrade:
    # Docker Image
    # NOTE: Use the stable_pi image for Raspberry Pi 4, or stable for x86/amd64 (Umbrel for Linux/Home).
    #image: freqtradeorg/freqtrade:stable_pi
    image: freqtradeorg/freqtrade:stable
    container_name: freqtrade
    restart: unless-stopped
    
    # Volumes Mapping for Data Persistence
    volumes:
      # Freqtrade's standard location for strategies, logs, config.
      - ${APP_DATA_DIR}/user_data:/freqtrade/user_data
      # Configuration file for the bot (recommended)
      - ${APP_DATA_DIR}/user_data/config.json:/freqtrade/user_data/config.json:ro
      # Database for trading data (SQLITE by default)
      - ${APP_DATA_DIR}/user_data/freqtrade.sqlite:/freqtrade/user_data/freqtrade.sqlite
    
    # PORT SELECTION: Use a free port in the non-standard range (>10000 is often safe).
    ports:
      # Format: EXTERN_PORT:INTERN_PORT
      # ${APP_FREQTRADE_PORT} : This is the variable that the Umbrel App Store will read from the umbrel-app.yml file
      # :-8080 is a fallback default value, very useful if the variable is not defined
      - ${APP_FREQTRADE_PORT:-8080}:8080
      #- "11080:8080" 
      
    # The command that launches the Freqtrade bot in trading mode (Dry-run or Live)
    command: >
      trade 
      --strategy SampleStrategy # Remplacez par votre stratégie par défaut ou laissez l'utilisateur configurer
      --config /freqtrade/user_data/config.json 
      --userdir /freqtrade/user_data
      --db-url sqlite:////freqtrade/user_data/freqtrade.sqlite
      --logfile /freqtrade/user_data/logs/freqtrade.log
      
    # Environment variables for user interface and time zone
    environment:
      - FREQTRADE_API_SERVER_ENABLED=true
      - FREQTRADE_API_SERVER_LISTEN_IP=0.0.0.0
      - FREQTRADE_API_SERVER_LISTEN_PORT=8080
      
      # Freqtrade WebUI Interface
      - FT_WEB_UI=true
      # Make sure to use the Umbrel host's time zone
      - TZ=${TZ} 
      # (Optional) API key if needed for web interface
      - FT_WEB_UI_KEY=your_secure_key # Replace with a real Umbrel key/variable

    # Docker Networks
    networks:
      - freqtrade_network

  # Configuring the FreqUI web interface
  freqtrade-ui:
    image: freqtradeorg/freqtrade:stable_freqaiui
    container_name: freqtrade-ui
    restart: unless-stopped
    ports:
      - ${APP_FREQTRADE_UI_PORT:-8081}:8080
    volumes:
      - ${APP_DATA_DIR}/user_data:/freqtrade/user_data
    depends_on:
      - freqtrade
    networks:
      - freqtrade_network

networks:
  freqtrade_network:
    driver: bridge
